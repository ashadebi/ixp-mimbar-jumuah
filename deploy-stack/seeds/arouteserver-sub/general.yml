      asns:
      - 174
      - 209
      - 286
      - 701
      - 1239
      - 1299
      - 2828
      - 2914
      - 3257
      - 3320
      - 3356
      - 3549
      - 5511
      - 6453
      - 6461
      - 6762
      - 6830
      - 7018
      - 12956
    never_via_route_servers:
      peering_db: true
    irrdb:
      enforce_origin_in_as_set: false
      enforce_prefix_in_as_set: false
      allow_longer_prefixes: true
      tag_as_set: true
      peering_db: false
      use_rpki_roas_as_route_objects:
        enabled: false
      use_arin_bulk_whois_data:
        enabled: false
      use_registrobr_bulk_whois_data:
        enabled: false
    rpki_bgp_origin_validation:
      enabled: false
      reject_invalid: true
    max_prefix:
      general_limit_ipv4: 100
      general_limit_ipv6: 10
      action: "restart"
      restart_after: 5
      count_rejected_routes: false
      peering_db:
        enabled: true
    reject_policy:
      policy: tag_and_reject
  blackhole_filtering:
    policy_ipv4: rewrite-next-hop
    policy_ipv6: rewrite-next-hop
    rewrite_next_hop_ipv4: "103.19.76.66"
    rewrite_next_hop_ipv6: "2001:7fa:2:50ba::2:66"
    announce_to_client: true
    add_noexport: true
  graceful_shutdown:
    enabled: true
  rfc1997_wellknown_communities:
